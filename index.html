<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronioñ Search</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- BAN-BOT-18 -->
    <script src="ban-bot-18.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        :root {
            --bg-color: #202124;
            --text-color: #bdc1c6;
            --search-bg: #202124;
            --search-border: #5f6368;
            --search-hover: #303134;
            --btn-bg: #303134;
            --btn-text: #e8eaed;
            --accent-color: #8ab4f8;
            --footer-bg: #171717;
            --logo-fill: #ffffff;
        }

        body.theme-halloween {
            --bg-color: #1a0b2e;
            --text-color: #f5e6d3;
            --search-bg: #2d1b4e;
            --search-border: #f15d22;
            --search-hover: #3d2b5e;
            --btn-bg: #4a2c2a;
            --btn-text: #ffd700;
            --accent-color: #f15d22;
            --footer-bg: #12051f;
        }

        body.theme-christmas {
            --bg-color: #0f1a15;
            --text-color: #e8f5e9;
            --search-bg: #1e2d24;
            --search-border: #e53935;
            --search-hover: #2e3d34;
            --btn-bg: #1b5e20;
            --btn-text: #fff;
            --accent-color: #e53935;
            --footer-bg: #050b07;
        }

        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; transition: background 0.5s; }
        
        /* Barra de Usuario (Top Right) */
        .top-bar { position: absolute; top: 15px; right: 25px; display: flex; align-items: center; gap: 15px; z-index: 100; }
        .user-btn { display: flex; align-items: center; gap: 8px; background: var(--search-bg); border: 1px solid var(--search-border); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-color); transition: 0.2s; }
        .user-btn:hover { border-color: var(--accent-color); }
        .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: #5865F2; display: flex; justify-content: center; align-items: center; font-size: 12px; color: white; }

        main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; }
        
        .logo-container { margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 100px; width: 100%; max-width: 450px; }
        .logo-svg { width: 100%; height: auto; filter: drop-shadow(0 0 15px rgba(138, 180, 248, 0.2)); transition: 0.3s; }
        .logo-svg:hover { filter: drop-shadow(0 0 25px var(--accent-color)); }

        /* Buscador */
        .search-form { width: 100%; max-width: 650px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .search-input-wrapper { width: 100%; position: relative; display: flex; align-items: center; background: var(--search-bg); border: 1px solid var(--search-border); border-radius: 24px; padding: 5px 10px 5px 20px; transition: 0.2s; }
        .search-input-wrapper:hover, .search-input-wrapper:focus-within { background-color: var(--search-hover); border-color: transparent; box-shadow: 0 1px 6px rgba(0,0,0,0.5); }
        
        input[type="text"] { flex: 1; padding: 10px 0; font-size: 16px; border: none; background: transparent; color: var(--text-color); outline: none; }

        .ai-mode-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--search-border); color: var(--accent-color); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; margin-left: 10px; }
        .ai-mode-btn:hover { background: rgba(138, 180, 248, 0.1); border-color: var(--accent-color); }
        .ai-mode-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .buttons-group { margin-top: 30px; display: flex; gap: 12px; }
        button.action-btn { background-color: var(--btn-bg); border: 1px solid transparent; color: var(--btn-text); padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button.action-btn:hover { border-color: var(--search-border); color: var(--accent-color); }

        /* Footer */
        footer { background-color: var(--footer-bg); font-size: 14px; color: var(--text-color); width: 100%; }
        .footer-location { padding: 15px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .footer-links { display: flex; justify-content: space-between; padding: 15px 30px; flex-wrap: wrap; gap: 15px; }
        .footer-links a { color: var(--text-color); text-decoration: none; opacity: 0.7; transition: 0.2s;}
        .footer-links a:hover { text-decoration: underline; opacity: 1; color: var(--accent-color); }
        .flex-gap { display: flex; gap: 25px; flex-wrap: wrap; }

        /* Modales */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .login-modal { background: #1e1f20; border: 1px solid #3c4043; border-radius: 16px; padding: 30px; width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .login-modal h2 { color: #fff; margin-bottom: 10px; }
        .login-modal p { color: #9aa0a6; font-size: 14px; margin-bottom: 25px; }
        .oauth-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .google-btn { background: #fff; color: #000; }
        .google-btn:hover { background: #eee; }
        .discord-btn { background: #5865F2; color: #fff; }
        .discord-btn:hover { background: #4752c4; }
        .close-modal { background: transparent; border: none; color: #9aa0a6; margin-top: 15px; cursor: pointer; font-size: 13px; }

        @media (max-width: 600px) {
            .logo-svg { width: 80%; }
            .ai-mode-btn span { display: none; }
            .footer-links { flex-direction: column; align-items: center; }
            .top-bar { top: 10px; right: 10px; }
        }
    </style>
</head>
<body>
    <!-- Barra de Usuario (Top Right) -->
    <div class="top-bar">
        <button class="user-btn" onclick="openLogin()">
            <span id="user-avatar-icon" class="user-avatar">👤</span>
            <span id="user-name-text">Iniciar sesión</span>
        </button>
    </div>

    <main>
        <!-- Logo SVG Oficial -->
        <div class="logo-container" id="logo-container">
            <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120">
                <text x="10" y="90" font-family="'Product Sans', 'Montserrat', 'Segoe UI', sans-serif" font-size="88" font-weight="500" fill="var(--logo-fill)" letter-spacing="-2">
                    Chronio<tspan fill="#ea4335">ñ</tspan>
                </text>
            </svg>
        </div>

        <!-- Formulario de Búsqueda -->
        <form class="search-form" action="search.html" method="GET" onsubmit="handleSearch(event)">
            <div class="search-input-wrapper">
                <input type="text" id="main-search-input" name="q" placeholder="Buscar en Chronioñ o haz una pregunta..." required autofocus autocomplete="off">
                
                <button type="button" class="ai-mode-btn" onclick="goToAIMode()" title="Hablar con Chronioñ IA">
                    <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"></path></svg>
                    <span>Modo IA</span>
                </button>
            </div>
            
            <div class="buttons-group">
                <button type="submit" class="action-btn">Buscar con Chronioñ</button>
                <button type="button" class="action-btn" onclick="location.href='search.html?q=Chronioñ+Browser'">Voy a tener suerte</button>
            </div>
        </form>
    </main>

    <footer>
        <div class="footer-location" id="footer-location">Chronioñ Web Engine © 2026</div>
        <div class="footer-links">
            <div class="flex-gap">
                <a href="https://github.com/anyelo888ra-ux/open-source-search-engine-chronion" target="_blank">Código Fuente</a>
                <a href="https://github.com/anyelo888ra-ux/chronion-browser" target="_blank">Chronioñ Browser (PC)</a>
            </div>
            <div class="flex-gap">
                <a href="Privacy.html">Privacidad</a>
                <a href="Conditions.html">Condiciones</a>
            </div>
        </div>
    </footer>

    <!-- MODAL LOGIN -->
    <div class="modal-overlay" id="login-modal">
        <div class="login-modal">
            <h2>Bienvenido a Chronioñ</h2>
            <p>Inicia sesión para guardar tu historial de forma segura.</p>
            <button class="oauth-btn google-btn" onclick="loginWith('google')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18" height="18" alt="G"> Google
            </button>
            <button class="oauth-btn discord-btn" onclick="loginWith('discord')">
                <svg width="20" height="20" viewBox="0 0 71 55" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M60.1 4.9A58.5 58.5 0 0045.4.2a.2.2 0 00-.2.1 40.7 40.7 0 00-1.8 3.7 54 54 0 00-16.2 0A38 38 0 0025.4.3a.2.2 0 00-.2-.1A58.4 58.4 0 0010.7 4.9a.2.2 0 00-.1.1C1.5 18.3-1 31.2.3 44a.2.2 0 00.1.2 58.8 58.8 0 0017.7 9 .2.2 0 00.3-.1 42 42 0 003.6-5.9.2.2 0 00-.1-.3 38.7 38.7 0 01-5.5-2.6.2.2 0 01-.1-.4c.4-.3.7-.6 1.1-1a.2.2 0 01.2 0 41.9 41.9 0 0035.6 0 .2.2 0 01.2 0l1.1 1a.2.2 0 01-.1.4 36.3 36.3 0 01-5.5 2.6.2.2 0 00-.1.3 47 47 0 003.6 5.9.2.2 0 00.3.1 58.6 58.6 0 0017.7-9 .2.2 0 00.1-.2c1.4-14.7-2.3-27.5-9.9-38.9a.2.2 0 00-.1-.1zM23.7 36.1c-3.5 0-6.3-3.2-6.3-7.1s2.8-7.1 6.3-7.1 6.4 3.2 6.3 7.1c0 3.9-2.8 7.1-6.3 7.1zm23.3 0c-3.5 0-6.3-3.2-6.3-7.1s2.8-7.1 6.3-7.1 6.4 3.2 6.3 7.1c0 3.9-2.8 7.1-6.3 7.1z" fill="#fff"/></svg>
                Discord
            </button>
            <button class="close-modal" onclick="closeLogin()">Continuar sin cuenta</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. LOGIN Y PERFIL (LocalStorage)
        // ==========================================
        let userProfile = JSON.parse(localStorage.getItem('chronion_user')) || null;

        function renderUserProfile() {
            const avatarIcon = document.getElementById('user-avatar-icon');
            const nameText = document.getElementById('user-name-text');
            const userBtn = document.querySelector('.user-btn');

            if (userProfile) {
                avatarIcon.innerHTML = userProfile.avatarEmoji || '😎';
                avatarIcon.style.background = '#3b82f6';
                nameText.innerText = userProfile.name;
                userBtn.onclick = logout; // Si ya está logueado, el botón cierra sesión
                userBtn.title = "Cerrar sesión";
            } else {
                avatarIcon.innerHTML = '👤';
                avatarIcon.style.background = '#5865F2';
                nameText.innerText = 'Iniciar sesión';
                userBtn.onclick = openLogin;
                userBtn.title = "Iniciar sesión";
            }
        }

        function openLogin() {
            document.getElementById('login-modal').classList.add('active');
        }

        function closeLogin() {
            document.getElementById('login-modal').classList.remove('active');
        }

        function loginWith(provider) {
            // Simulamos la respuesta de OAuth
            const randomName = (provider === 'google' ? 'User' : 'Gamer') + '_' + Math.floor(Math.random() * 9999);
            const randomEmoji = ["😎", "🤖", "👾", "🐋", "🚀", "🦊", "🔥"][Math.floor(Math.random() * 7)];
            
            userProfile = {
                id: provider + '_' + Date.now(),
                provider: provider,
                name: randomName,
                avatarEmoji: randomEmoji
            };
            
            localStorage.setItem('chronion_user', JSON.stringify(userProfile));
            renderUserProfile();
            closeLogin();
        }

        function logout() {
            if(confirm("¿Seguro que quieres cerrar sesión?")) {
                localStorage.removeItem('chronion_user');
                userProfile = null;
                renderUserProfile();
            }
        }

        // ==========================================
        // 2. MOTOR DE TEMAS ESTACIONALES (Corregido)
        // ==========================================
        const today = new Date();
        const month = today.getMonth() + 1;

        function applySeasonalTheme() {
            const body = document.body;
            const logoContainer = document.getElementById('logo-container');
            const footerText = document.getElementById('footer-location');

            if (month === 10) {
                body.classList.add('theme-halloween');
                logoContainer.innerHTML = `<svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="var(--accent-color)" d="M50 10 C20 10 10 40 10 60 C10 80 30 90 50 90 C70 90 90 80 90 60 C90 40 80 10 50 10 Z M30 50 L40 50 M60 50 L70 50 M50 70 Q60 80 70 70"/></svg>`;
                footerText.innerText = "Chronioñ Web Engine 🎃 Spooky Edition";
                document.getElementById('main-search-input').placeholder = "Busca algo terrorífico...";
            } else if (month === 12) {
                body.classList.add('theme-christmas');
                logoContainer.innerHTML = `<svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon fill="var(--accent-color)" points="50,10 90,80 10,80"/><polygon fill="var(--accent-color)" points="50,30 80,80 20,80"/><rect fill="#795548" width="10" height="10" x="45" y="80"/><circle fill="#fff" cx="50" cy="10" r="5"/></svg>`;
                footerText.innerText = "Chronioñ Web Engine 🎄 Merry Christmas";
                document.getElementById('main-search-input').placeholder = "¿Qué regalo estás buscando?";
                startSnow();
            } else {
                footerText.innerText = "Chronioñ Web Engine © " + today.getFullYear();
            }
        }

        // Efecto Nieve
        function startSnow() {
            setInterval(() => {
                const snowflake = document.createElement('div');
                snowflake.innerHTML = '❅';
                snowflake.classList.add('snowflake');
                snowflake.style.left = Math.random() * 100 + 'vw';
                snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
                snowflake.style.opacity = Math.random();
                snowflake.style.fontSize = Math.random() * 10 + 10 + 'px';
                document.body.appendChild(snowflake);
                setTimeout(() => snowflake.remove(), 5000);
            }, 200);
        }

        // Funciones del Buscador
        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('main-search-input').value.trim();
            if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        }

        function goToAIMode() {
            const query = document.getElementById('main-search-input').value.trim();
            if (query) window.location.href = `chat.html?q=${encodeURIComponent(query)}`;
            else window.location.href = 'chat.html';
        }

        // Ejecutar al cargar
        document.addEventListener('DOMContentLoaded', () => {
            applySeasonalTheme();
            renderUserProfile();
        });
    </script>

</body>
</html>
