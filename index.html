<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronioñ Search</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- BAN-BOT-18 (Moderación Global) -->
    <script src="ban-bot-18.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        /* Variables Globales (Se modifican con JS según la estación) */
        :root {
            --bg-color: #202124;
            --text-color: #bdc1c6;
            --search-bg: #202124;
            --search-border: #5f6368;
            --search-hover: #303134;
            --btn-bg: #303134;
            --btn-text: #e8eaed;
            --accent-color: #8ab4f8;
            --footer-bg: #171717;
        }

        /* Tema Halloween */
        body.theme-halloween {
            --bg-color: #1a0b2e;
            --text-color: #f5e6d3;
            --search-bg: #2d1b4e;
            --search-border: #f15d22;
            --search-hover: #3d2b5e;
            --btn-bg: #4a2c2a;
            --btn-text: #ffd700;
            --accent-color: #f15d22;
            --footer-bg: #12051f;
        }

        /* Tema Navidad */
        body.theme-christmas {
            --bg-color: #0f1a15;
            --text-color: #e8f5e9;
            --search-bg: #1e2d24;
            --search-border: #e53935;
            --search-hover: #2e3d34;
            --btn-bg: #1b5e20;
            --btn-text: #fff;
            --accent-color: #e53935;
            --footer-bg: #050b07;
        }

        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; transition: background 0.5s; }
        
        /* Layout Principal */
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; }
        
        /* Logo */
        .logo-container { margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 100px; }
        .logo-img { width: 280px; height: auto; filter: drop-shadow(0 0 15px rgba(138, 180, 248, 0.2)); transition: 0.3s; }
        .logo-container.theme-icon .logo-img { width: 100px; } /* Logo más pequeño si es un icono de evento */
        .logo-img:hover { filter: drop-shadow(0 0 25px var(--accent-color)); }

        /* Buscador */
        .search-form { width: 100%; max-width: 650px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .search-input-wrapper { width: 100%; position: relative; display: flex; align-items: center; background: var(--search-bg); border: 1px solid var(--search-border); border-radius: 24px; padding: 5px 10px 5px 20px; transition: 0.2s; }
        .search-input-wrapper:hover, .search-input-wrapper:focus-within { background-color: var(--search-hover); border-color: transparent; box-shadow: 0 1px 6px rgba(0,0,0,0.5); }
        
        input[type="text"] { flex: 1; padding: 10px 0; font-size: 16px; border: none; background: transparent; color: var(--text-color); outline: none; }

        /* Botón Modo IA */
        .ai-mode-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--search-border); color: var(--accent-color); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; margin-left: 10px; }
        .ai-mode-btn:hover { background: rgba(138, 180, 248, 0.1); border-color: var(--accent-color); }
        .ai-mode-btn svg { width: 16px; height: 16px; fill: currentColor; }

        /* Botones de acción */
        .buttons-group { margin-top: 30px; display: flex; gap: 12px; }
        button.action-btn { background-color: var(--btn-bg); border: 1px solid transparent; color: var(--btn-text); padding: 10px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button.action-btn:hover { border-color: var(--search-border); color: var(--accent-color); }

        /* Footer */
        footer { background-color: var(--footer-bg); font-size: 14px; color: var(--text-color); width: 100%; transition: background 0.5s; }
        .footer-location { padding: 15px 30px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .footer-links { display: flex; justify-content: space-between; padding: 15px 30px; flex-wrap: wrap; gap: 15px; }
        .footer-links a { color: var(--text-color); text-decoration: none; opacity: 0.7; transition: 0.2s;}
        .footer-links a:hover { text-decoration: underline; opacity: 1; color: var(--accent-color); }
        .flex-gap { display: flex; gap: 25px; flex-wrap: wrap; }

        /* Nieve de Navidad */
        .snowflake { position: fixed; top: -10px; color: white; font-size: 1em; pointer-events: none; z-index: 9999; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

        @media (max-width: 600px) {
            .logo-img { width: 200px; }
            .logo-container.theme-icon .logo-img { width: 80px; }
            .ai-mode-btn span { display: none; }
            .footer-links { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <main>
      <!-- Contenedor del Logo -->
      <div class="logo-container" id="logo-container">
      <!-- Logo SVG Oficial (Modo Normal) -->
      <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120">
        <text x="10" y="90" font-family="'Product Sans', 'Montserrat', 'Segoe UI', sans-serif" font-size="88" font-weight="500" fill="#ffffff" letter-spacing="-2">
            Chronio<tspan fill="#ea4335">ñ</tspan>
        </text>
    </svg>
</div>

        <!-- Formulario de Búsqueda -->
        <form class="search-form" action="search.html" method="GET" onsubmit="handleSearch(event)">
            <div class="search-input-wrapper">
                <input type="text" id="main-search-input" name="q" placeholder="Buscar en Chronioñ o haz una pregunta..." required="" autofocus="" autocomplete="off">
                
                <!-- Botón Modo IA -->
                <button type="button" class="ai-mode-btn" onclick="goToAIMode()" title="Hablar con Chronioñ IA">
                    <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"></path></svg>
                    <span>Modo IA</span>
                </button>
            </div>
            
            <div class="buttons-group">
                <button type="submit" class="action-btn">Buscar con Chronioñ</button>
                <button type="button" class="action-btn" onclick="location.href='search.html?q=Chronioñ+Browser'">Voy a tener suerte</button>
            </div>
        </form>
    </main>

    <footer>
        <div class="footer-location" id="footer-location">Chronioñ Web Engine © 2026</div>
        <div class="footer-links">
            <div class="flex-gap">
                <a href="https://github.com/anyelo888ra-ux/open-source-search-engine-chronion" target="_blank">Código Fuente</a>
                <a href="https://github.com/anyelo888ra-ux/chronion-browser" target="_blank">Chronioñ Browser (PC)</a>
                <a href="https://github.com/anyelo888ra-ux/chronion.apk-open-source" target="_blank">Chronioñ (Android)</a>
            </div>
            <div class="flex-gap">
                <a href="Privacy.html">Privacidad</a>
                <a href="Conditions.html">Condiciones</a>
            </div>
        </div>
    </footer>

    <script>
        // ==========================================
        // MOTOR DE TEMAS ESTACIONALES
        // ==========================================
        
        const today = new Date();
        const month = today.getMonth() + 1; // 1 = Enero, 12 = Diciembre

        function applySeasonalTheme() {
            const body = document.body;
            const logoContainer = document.getElementById('logo-container');
            const logoImg = document.getElementById('main-logo');
            const footerText = document.getElementById('footer-location');

            // --- HALLOWEEN (Octubre) ---
            if (month === 10) {
                body.classList.add('theme-halloween');
                logoImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path fill='%23f15d22' d='M50 10 C20 10 10 40 10 60 C10 80 30 90 50 90 C70 90 90 80 90 60 C90 40 80 10 50 10 Z M30 50 L40 50 M60 50 L70 50 M50 70 Q60 80 70 70'/></svg>";
                logoContainer.classList.add('theme-icon');
                footerText.innerText = "Chronioñ Web Engine 🎃 Spooky Edition";
                document.getElementById('main-search-input').placeholder = "Busca algo terrorífico...";
            }
            
            // --- NAVIDAD (Diciembre) ---
            else if (month === 12) {
                body.classList.add('theme-christmas');
                logoImg.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon fill='%2334a853' points='50,10 90,80 10,80'/><polygon fill='%2334a853' points='50,30 80,80 20,80'/><rect fill='%23795548' width='10' height='10' x='45' y='80'/><circle fill='%23e53935' cx='50' cy='10' r='5'/></svg>";
                logoContainer.classList.add('theme-icon');
                footerText.innerText = "Chronioñ Web Engine 🎄 Merry Christmas";
                document.getElementById('main-search-input').placeholder = "¿Qué regalo estás buscando?";
                startSnow();
            }

            // --- NORMAL (Resto del año) ---
            else {
                // Se queda con el logo original y colores por defecto
                footerText.innerText = "Chronioñ Web Engine © " + today.getFullYear();
            }
        }

        // Efecto Nieve para Navidad
        function startSnow() {
            setInterval(() => {
                const snowflake = document.createElement('div');
                snowflake.innerHTML = '❅';
                snowflake.classList.add('snowflake');
                snowflake.style.left = Math.random() * 100 + 'vw';
                snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
                snowflake.style.opacity = Math.random();
                snowflake.style.fontSize = Math.random() * 10 + 10 + 'px';
                document.body.appendChild(snowflake);
                
                setTimeout(() => snowflake.remove(), 5000);
            }, 200);
        }

        // Funciones del Buscador
        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('main-search-input').value.trim();
            if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        }

        function goToAIMode() {
            const query = document.getElementById('main-search-input').value.trim();
            if (query) window.location.href = `chat.html?q=${encodeURIComponent(query)}`;
            else window.location.href = 'chat.html';
        }

        // Ejecutar al cargar
        document.addEventListener('DOMContentLoaded', applySeasonalTheme);
    </script>

</body></html>
