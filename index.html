<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronioñ Search</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .logo-container { margin-bottom: 2rem; width: 320px; max-width: 80%; display: flex; justify-content: center; }
        .logo-container img { width: 100%; height: auto; }
        .search-box { width: 90%; max-width: 600px; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 14px 20px; font-size: 1.1rem; border-radius: 25px; border: 2px solid #334155; background-color: #1e293b; color: #fff; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        button { padding: 14px 24px; font-size: 1rem; border-radius: 25px; border: none; background-color: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0ea5e9; }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="logo.svg" alt="Chronioñ Logo">
    </div>
    <form class="search-box" action="search.html" method="GET">
        <input type="text" name="q" placeholder="Buscar en la web con Chronioñ..." required autofocus>
        <button type="submit">Buscar</button>
    </form>
</body>
</html>
