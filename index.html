<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronioñ Search</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #202124; color: #bdc1c6; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Layout Principal */
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        
        .logo-container { margin-bottom: 25px; width: 280px; text-align: center; }
        .logo-container img { width: 100%; max-width: 280px; height: auto; }

        .search-form { width: 100%; max-width: 580px; display: flex; flex-direction: column; align-items: center; }
        .search-input-wrapper { width: 100%; position: relative; }
        
        input[type="text"] {
            width: 100%;
            padding: 13px 20px;
            font-size: 16px;
            border-radius: 24px;
            border: 1px solid #5f6368;
            background-color: #202124;
            color: #e8eaed;
            outline: none;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        
        input[type="text"]:hover, input[type="text"]:focus {
            background-color: #303134;
            border-color: transparent;
            box-shadow: 0 1px 6px rgba(0,0,0,0.5);
        }

        .buttons-group { margin-top: 28px; display: flex; gap: 12px; }
        button {
            background-color: #303134;
            border: 1px solid #303134;
            color: #e8eaed;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }
        button:hover { border-color: #5f6368; color: #fff; }

        /* Footer estilo Google */
        footer { background-color: #171717; font-size: 14px; color: #9aa0a6; }
        .footer-location { padding: 15px 30px; border-bottom: 1px solid #212327; }
        .footer-links { display: flex; justify-content: space-between; padding: 15px 30px; flex-wrap: wrap; gap: 15px; }
        .footer-links a { color: #9aa0a6; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }
        .flex-gap { display: flex; gap: 25px; }
    </style>
</head>
<body>
    <main>
        <div class="logo-container">
            <img src="logo.svg" alt="Chronioñ Search">
        </div>
        <form class="search-form" action="search.html" method="GET">
            <div class="search-input-wrapper">
                <input type="text" name="q" placeholder="Buscar en Chronioñ..." required autofocus autocomplete="off">
            </div>
            <div class="buttons-group">
                <button type="submit">Buscar con Chronioñ</button>
                <button type="button" onclick="location.href='search.html?q=Chronioñ+Browser'">Voy a tener suerte</button>
            </div>
        </form>
    </main>

    <footer>
        <div class="footer-location">Chronioñ Web Engine</div>
        <div class="footer-links">
            <div class="flex-gap">
                <a href="https://github.com/anyelo888ra-ux/open-source-search-engine-chronion" target="_blank">Código Fuente</a>
                <a href="https://github.com/anyelo888ra-ux/chronion-browser" target="_blank">Chronioñ Browser (PC)</a>
                <a href="https://github.com/anyelo888ra-ux/chronion.apk-open-source" target="_blank">Chronioñ (Android)</a>
            </div>
            <div class="flex-gap">
                <a href="Privacy.html">Privacidad</a>
                <a href="Conditions.html">Condiciones</a>
            </div>
        </div>
    </footer>
</body>
</html>
