<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo con gradiente multicolor estilo Google -->
  <defs>
    <linearGradient id="chronionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="35%" stop-color="#EA4335"/>
      <stop offset="70%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
  </defs>
  
  <!-- Círculo exterior multicolor -->
  <circle cx="256" cy="256" r="240" fill="url(#chronionGrad)" />
  
  <!-- Fondo interior blanco -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" />
  
  <!-- Letra Ñ central -->
  <text x="256" y="325" font-family="'Product Sans', 'Montserrat', 'Segoe UI', sans-serif" font-size="240" font-weight="700" fill="#4285F4" text-anchor="middle">
    Ñ
  </text>
</svg>
