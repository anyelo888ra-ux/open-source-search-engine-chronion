<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronioñ Search Console</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #202124; color: #bdc1c6; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        header { display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid #3c4043; gap: 16px; background: #171717; }
        .logo-link { height: 30px; display: flex; align-items: center; text-decoration: none; color: #8ab4f8; font-weight: bold; font-size: 20px; }
        .logo-link img { height: 100%; width: auto; margin-right: 10px; }
        
        /* Layout Principal */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; width: 100%; flex: 1; }
        
        .title-section { margin-bottom: 30px; }
        .title-section h1 { color: #fff; font-size: 28px; margin-bottom: 8px; }
        .title-section p { color: #9aa0a6; font-size: 15px; }

        /* Tarjetas de Propiedad */
        .property-card { background: #303134; border: 1px solid #5f6368; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .property-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #5f6368; padding-bottom: 15px; margin-bottom: 20px; }
        .property-url { font-size: 18px; color: #fff; font-weight: 500; word-break: break-all; }
        
        /* Métodos de Verificación */
        .verify-section { margin-top: 20px; }
        .verify-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #5f6368; padding-bottom: 10px; }
        .v-tab { background: transparent; border: none; color: #9aa0a6; cursor: pointer; padding: 8px 12px; font-size: 14px; border-radius: 6px; transition: 0.2s; }
        .v-tab.active { background: #8ab4f8; color: #202124; font-weight: bold; }

        .v-content { display: none; background: #202124; padding: 20px; border-radius: 8px; border: 1px solid #5f6368; }
        .v-content.active { display: block; }

        /* Código de verificación */
        .code-box { background: #111; border: 1px dashed #8ab4f8; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 14px; color: #8ab4f8; margin: 15px 0; word-break: break-all; position: relative; cursor: pointer; }
        .code-box:hover { background: #1a1a1a; }
        .code-box::after { content: "📋 Copiar"; position: absolute; right: 10px; top: 10px; font-size: 12px; color: #9aa0a6; font-family: 'Segoe UI', sans-serif; }
        
        .verify-btn { background: #8ab4f8; color: #202124; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .verify-btn:hover { background: #aecbfa; }
        .verify-btn:disabled { background: #5f6368; cursor: not-allowed; }

        /* Lista de URLs indexadas */
        .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        .status-badge.pending { background: #fbbc04; color: #000; }
        .status-badge.indexed { background: #34a853; color: #fff; }
        .status-badge.error { background: #ea4335; color: #fff; }

        /* Utilidades */
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .mt-15 { margin-top: 15px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link"><img src="logo.svg" alt="Logo"> Chronioñ Console</a>
    </header>

    <div class="container">
        <div class="title-section">
            <h1>Bienvenido a Chronioñ Search Console</h1>
            <p>Indexa tu sitio web en el motor de búsqueda Chronioñ y verifica su propiedad.</p>
        </div>

        <!-- Formulario para añadir propiedad -->
        <div class="property-card">
            <div class="property-header">
                <div class="property-url">Añadir una nueva propiedad (URL)</div>
            </div>
            <div class="flex-row">
                <input type="text" id="newUrl" placeholder="https://tu-sitio-web.com" style="flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #5f6368; background: #202124; color: #fff; outline: none;">
                <button class="verify-btn" onclick="addProperty()">Añadir Propiedad</button>
            </div>
        </div>

        <!-- Contenedor de Propiedades -->
        <div id="properties-container"></div>
    </div>

    <script>
        // Base de datos local simulada (LocalStorage)
        let properties = JSON.parse(localStorage.getItem('chronion_properties')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderProperties();
        });

        // Generador de token criptográfico (ej. chronioñ1a2b3c)
        function generateToken() {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return 'chronioñ' + array[0].toString(16);
        }

        function addProperty() {
            const urlInput = document.getElementById('newUrl');
            let url = urlInput.value.trim();
            
            if (!url) return alert('Por favor, ingresa una URL válida.');
            if (!url.startsWith('http')) url = 'https://' + url;

            // Quitar la barra final si la tiene
            if (url.endsWith('/')) url = url.slice(0, -1);

            if (properties.some(p => p.url === url)) return alert('Esta propiedad ya está registrada.');

            properties.push({ 
                url: url, 
                verified: false, 
                indexed: false,
                token: generateToken()
            });
            localStorage.setItem('chronion_properties', JSON.stringify(properties));
            urlInput.value = '';
            renderProperties();
        }

        function renderProperties() {
            const container = document.getElementById('properties-container');
            container.innerHTML = '';

            if (properties.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #9aa0a6;">No tienes propiedades registradas aún.</p>`;
                return;
            }

            properties.forEach((prop, index) => {
                const card = document.createElement('div');
                card.className = 'property-card';
                card.innerHTML = `
                    <div class="property-header">
                        <div class="property-url">${prop.url}</div>
                        <div class="status-badge ${prop.verified ? 'indexed' : 'pending'}">
                            ${prop.verified ? 'Verificado' : 'Pendiente'}
                        </div>
                    </div>

                    <div class="verify-section" id="verify-section-${index}" style="display: ${prop.verified ? 'none' : 'block'};">
                        <p style="font-size: 14px; color: #9aa0a6; margin-bottom: 15px;">Para verificar que eres el dueño, elige un método:</p>
                        
                        <div class="verify-tabs">
                            <button class="v-tab active" onclick="switchVerifyTab(${index}, 'html')">Metaetiqueta HTML</button>
                            <button class="v-tab" onclick="switchVerifyTab(${index}, 'file')">Archivo HTML de verificación</button>
                        </div>

                        <!-- Método 1: Metaetiqueta -->
                        <div class="v-content active" id="v-html-${index}">
                            <p style="font-size: 14px; color: #bdc1c6;">1. Copia esta metaetiqueta:</p>
                            <div class="code-box" onclick="copyToClipboard(this)">
                                &lt;meta name="chronioñ-site-verification" content="${prop.token}" /&gt;
                            </div>
                            <p style="font-size: 14px; color: #bdc1c6;">2. Pégala dentro de la etiqueta &lt;head&gt; de tu sitio web.</p>
                            <p style="font-size: 14px; color: #bdc1c6;">3. Vuelve aquí y pulsa verificar.</p>
                            <button class="verify-btn" id="btn-verify-html-${index}" onclick="verifyProperty(${index}, 'html', event)">Verificar Propiedad</button>
                        </div>

                        <!-- Método 2: Archivo HTML -->
                        <div class="v-content" id="v-file-${index}">
                            <p style="font-size: 14px; color: #bdc1c6;">1. Descarga el archivo de verificación oficial de Chronioñ:</p>
                            <button class="verify-btn" style="background: #303134; color: #8ab4f8; border: 1px solid #8ab4f8;" onclick="downloadVerificationFile('${prop.token}')">⬇️ Descargar ${prop.token}.html</button>
                            
                            <p style="font-size: 14px; color: #bdc1c6; margin-top: 15px;">2. Súbelo a la raíz de tu sitio web para que sea accesible en:<br>
                            <span style="color: #8ab4f8;">${prop.url}/${prop.token}.html</span></p>
                            
                            <p style="font-size: 14px; color: #bdc1c6;">3. Vuelve aquí y pulsa verificar.</p>
                            <button class="verify-btn" id="btn-verify-file-${index}" onclick="verifyProperty(${index}, 'file', event)">Verificar Propiedad</button>
                        </div>
                    </div>

                    <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;" id="index-status-${index}">
                        ${prop.verified ? `
                            <p style="font-size: 14px; color: #34a853;">✅ Verificado. Listo para indexar.</p>
                            <button class="verify-btn" style="background: #34a853; color: #fff;" onclick="requestIndex(${index}, event)">Solicitar Indexación</button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchVerifyTab(index, method) {
            const htmlTab = document.getElementById(`v-html-${index}`);
            const fileTab = document.getElementById(`v-file-${index}`);
            const tabs = document.querySelectorAll(`#verify-section-${index} .v-tab`);

            tabs.forEach(t => t.classList.remove('active'));
            if (method === 'html') {
                event.target.classList.add('active');
                htmlTab.classList.add('active');
                fileTab.classList.remove('active');
            } else {
                event.target.classList.add('active');
                fileTab.classList.add('active');
                htmlTab.classList.remove('active');
            }
        }

        // VERIFICACIÓN REAL (Usando un proxy CORS público para saltar el bloqueo del navegador)
        async function verifyProperty(index, method, event) {
            const prop = properties[index];
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = 'Verificando...';
            btn.disabled = true;

            const corsProxy = 'https://api.allorigins.win/raw?url=';
            let targetUrl = '';

            if (method === 'file') {
                targetUrl = `${prop.url}/${prop.token}.html`;
            } else {
                targetUrl = prop.url;
            }

            try {
                const response = await fetch(corsProxy + encodeURIComponent(targetUrl));
                
                if (!response.ok) throw new Error("No se pudo acceder a la URL");

                const text = await response.text();

                let isValid = false;
                if (method === 'file') {
                    isValid = text.includes(`chronioñ-site-verification: ${prop.token}.html`);
                } else {
                    const metaRegex = new RegExp(`<meta name="chronioñ-site-verification" content="${prop.token}"`, 'i');
                    isValid = metaRegex.test(text);
                }

                if (isValid) {
                    properties[index].verified = true;
                    localStorage.setItem('chronion_properties', JSON.stringify(properties));
                    renderProperties();
                    alert(`✅ ¡Propiedad verificada con éxito! ChronioBot ya tiene permiso para rastrear.`);
                } else {
                    alert(`❌ Verificación fallida. El token no coincide o el archivo/metaetiqueta no existe en el código fuente.`);
                    btn.innerText = originalText;
                    btn.disabled = false;
                }

            } catch (error) {
                alert("⚠️ Error de red. Asegúrate de que tu web esté online y no bloquee peticiones.");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // SIMULACIÓN DE RASTREO (ChronioBot)
        function requestIndex(index, event) {
            const btn = event.target;
            btn.innerText = 'Enviando a ChronioBot...';
            btn.disabled = true;
            
            setTimeout(() => {
                properties[index].indexed = true;
                localStorage.setItem('chronion_properties', JSON.stringify(properties));
                renderProperties();
                alert('🤖 ¡URL añadida a la cola de rastreo de ChronioBot! Aparecerá en los resultados en breve.');
            }, 2000);
        }

        function copyToClipboard(element) {
            const text = element.innerText.replace('📋 Copiar', '').trim();
            navigator.clipboard.writeText(text).then(() => {
                element.innerHTML = text + ' <span style="color: #34a853; font-size: 12px; margin-left: 10px;">¡Copiado!</span>';
                setTimeout(() => {
                    element.innerHTML = text + ' <span style="position: absolute; right: 10px; top: 10px; font-size: 12px; color: #9aa0a6; font-family: \'Segoe UI\', sans-serif;">📋 Copiar</span>';
                }, 2000);
            });
        }

        // Descarga el archivo con el formato exacto de Google
        function downloadVerificationFile(token) {
            const filename = `${token}.html`;
            const content = `chronioñ-site-verification: ${filename}`;
            
            const blob = new Blob([content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Generador de Sitemap (Función extra para la consola)
        function generateSitemap(url) {
            const sitemapXML = `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>${url}</loc>
    <lastmod>${new Date().toISOString().split('T')[0]}</lastmod>
    <changefreq>daily</changefreq>
    <priority>1.0</priority>
  </url>
</urlset>`;
            
            const blob = new Blob([sitemapXML], { type: 'application/xml' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'sitemap.xml';
            link.click();
            alert("Sitemap generado. Súbelo a la raíz de tu web.");
        }
    </script>
</body>
</html>
