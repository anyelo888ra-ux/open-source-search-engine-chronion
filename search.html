
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#202124">
    <meta name="description" content="Busca en Chronioñ: sitios registrados, Wikipedia y más.">
    <title>Búsqueda en Chronioñ</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="ban-bot-18.js"></script>

    <style>
        :root {
            color-scheme: dark;
            --bg: #202124;
            --surface: #303134;
            --surface2: #1e1f20;
            --border: #3c4043;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --blue: #8ab4f8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        button, input {
            font: inherit;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 3px;
        }

        /* HEADER */

        header {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }

        .logo-link {
            height: 30px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-link img {
            height: 100%;
            width: auto;
        }

        .search-box {
            width: 100%;
            max-width: 690px;
        }

        .search-box form {
            display: flex;
            width: 100%;
        }

        #searchInput {
            width: 100%;
            padding: 11px 18px;
            font-size: 15px;
            border-radius: 24px;
            border: 1px solid #5f6368;
            background: var(--surface);
            color: var(--text);
            outline: none;
        }

        #searchInput:focus {
            border-color: var(--blue);
        }

        /* TABS */

        .nav-tabs {
            display: flex;
            gap: 22px;
            padding: 12px 160px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            white-space: nowrap;
        }

        .tab {
            display: inline-block;
            text-decoration: none;
            background: transparent;
            border: 0;
            color: var(--muted);
            padding: 5px 0 9px;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--blue);
            border-color: var(--blue);
            font-weight: 600;
        }

        .tab.ai-tab {
            color: #c2e7ff;
            font-weight: bold;
        }

        .tab.ai-tab.active {
            border-color: #c2e7ff;
        }

        /* MAIN */

        .main-layout {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            max-width: 1100px;
            margin-left: 160px;
            padding: 22px 20px 50px 0;
        }

        .results-column {
            flex: 1;
            min-width: 0;
            max-width: 680px;
        }

        .knowledge-column {
            width: 350px;
            flex-shrink: 0;
            display: none;
        }

        .status-text {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 17px;
            color: var(--blue);
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* RESULTADOS */

        .result-item {
            margin-bottom: 27px;
            overflow-wrap: anywhere;
        }

        .result-site {
            color: #bdc1c6;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .result-title {
            display: inline-block;
            color: var(--blue);
            font-size: 20px;
            text-decoration: none;
            margin-bottom: 6px;
        }

        .result-title:hover {
            text-decoration: underline;
        }

        .result-snippet {
            color: #bdc1c6;
            font-size: 14px;
            line-height: 1.55;
        }

        .result-img {
            width: 95px;
            max-height: 95px;
            object-fit: cover;
            border-radius: 8px;
            float: left;
            margin: 0 13px 7px 0;
        }

        .result-meta {
            color: var(--muted);
            font-size: 12px;
            margin-top: 7px;
        }

        /* IA */

        .ai-overview-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-left: 4px solid var(--blue);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
        }

        .ai-header {
            color: var(--blue);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .ai-content {
            color: var(--text);
            font-size: 15px;
            line-height: 1.7;
        }

        .ai-disclaimer {
            font-size: 12px;
            color: var(--muted);
            margin-top: 12px;
        }

        /* PANEL DE CONOCIMIENTO */

        .knowledge-panel {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .kg-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .kg-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 13px;
        }

        .kg-image {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 9px;
        }

        .kg-title {
            font-size: 22px;
            color: white;
            font-weight: 600;
        }

        .kg-desc {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text);
        }

        .kg-related {
            padding: 20px;
        }

        .kg-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .kg-card {
            background: var(--surface);
            border-radius: 9px;
            padding: 12px 7px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
            transition: .2s;
        }

        .kg-card:hover {
            background: #45474b;
            transform: translateY(-2px);
        }

        .kg-card img {
            display: block;
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin: 0 auto 8px;
        }

        /* IMÁGENES */

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 12px;
        }

        .image-result {
            display: block;
            background: var(--surface);
            padding: 8px;
            border-radius: 9px;
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
            transition: .2s;
        }

        .image-result:hover {
            background: #45474b;
        }

        .image-result img {
            width: 100%;
            height: 125px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 7px;
        }

        /* MENSAJES Y EASTER EGGS */

        .special-card {
            border: 1px solid var(--border);
            background: var(--surface2);
            border-radius: 14px;
            padding: 28px;
            margin: 12px 0 25px;
            text-align: center;
        }

        .special-card h2 {
            font-size: 27px;
            margin-bottom: 12px;
        }

        .special-card p {
            color: var(--text);
            line-height: 1.6;
            font-size: 14px;
        }

        .special-icon {
            font-size: 55px;
            margin-bottom: 13px;
        }

        .special-button {
            border: 0;
            background: var(--blue);
            color: #172033;
            padding: 11px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 18px;
            transition: .2s;
        }

        .special-button:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }

        .amogus-card {
            background: linear-gradient(135deg, #c51111, #650000);
            border: 2px solid #ff3333;
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            color: white;
            box-shadow: 0 0 25px rgba(255, 0, 0, .2);
            margin-bottom: 25px;
        }

        .amogus-title {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .amogus-btn {
            background: #ff2222;
            color: white;
            border: 2px solid white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
        }

        .amogus-btn:hover {
            background: #ff5555;
        }

        .matrix-card {
            background: #001500;
            border: 1px solid #00aa33;
            color: #00ff55;
            font-family: monospace;
            text-shadow: 0 0 8px #00ff55;
        }

        .matrix-card h2,
        .matrix-card p {
            color: #00ff55;
            font-family: monospace;
        }

        .nexus-card {
            background: linear-gradient(135deg, #101b35, #153d58);
            border: 1px solid #28b9e8;
        }

        .nexus-card h2 {
            color: #75dfff;
        }

        .chronion-card {
            background: linear-gradient(135deg, #27213d, #303d65);
            border: 1px solid #a5b8ff;
        }

        /* MINIJUEGO */

        #amogus-game-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .96);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .game-header {
            color: #ff4444;
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        #amogus-canvas {
            width: min(600px, 94vw);
            height: auto;
            background: #111;
            border: 2px solid #ff3333;
            border-radius: 12px;
        }

        .game-controls {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .game-btn {
            background: #b91c1c;
            color: white;
            border: 0;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .game-btn:hover {
            background: #e22;
        }

        .game-help {
            color: #aaa;
            font-size: 12px;
            margin-top: 12px;
            text-align: center;
        }

        /* BARREL ROLL */

        .barrel-roll {
            animation: barrelRoll .75s ease-in-out;
        }

        @keyframes barrelRoll {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        footer {
            padding: 22px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--blue);
            text-decoration: none;
        }

        /* MÓVIL */

        @media (max-width: 900px) {
            .nav-tabs {
                padding: 12px 20px;
                gap: 19px;
            }

            .main-layout {
                flex-direction: column;
                margin: 0;
                padding: 20px;
            }

            .results-column {
                width: 100%;
                max-width: none;
            }

            .knowledge-column {
                width: 100%;
            }
        }

        @media (max-width: 550px) {
            header {
                padding: 13px;
                gap: 12px;
            }

            .logo-link {
                height: 24px;
            }

            #searchInput {
                font-size: 14px;
                padding: 10px 13px;
            }

            .result-title {
                font-size: 18px;
            }

            .special-card {
                padding: 22px 14px;
            }

            .amogus-title {
                font-size: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo-link">
        <img src="logo.svg" alt="Chronioñ Logo">
    </a>

    <div class="search-box">
        <form action="search.html" method="GET" id="searchForm">
            <input
                type="text"
                id="searchInput"
                name="q"
                placeholder="Buscar en Chronioñ..."
                required
                autocomplete="off"
                aria-label="Buscar"
            >
            <input type="hidden" name="mode" id="modeInput" value="todo">
        </form>
    </div>
</header>

<nav class="nav-tabs" aria-label="Categorías de búsqueda">
    <button class="tab active" id="tab-todo" type="button" data-mode="todo">Todo</button>
    <button class="tab ai-tab" id="tab-ia" type="button" data-mode="ia">✨ Modo IA</button>
    <button class="tab" id="tab-img" type="button" data-mode="img">Imágenes</button>
    <button class="tab" id="tab-videos" type="button" data-mode="videos">Vídeos</button>
    <button class="tab" id="tab-noticias" type="button" data-mode="noticias">Noticias</button>
    <a class="tab maps-tab" id="tab-maps" href="map.html" title="Abrir Chronioñ Maps">🗺️ Maps</a>
</nav>

<div class="main-layout">

    <main class="results-column">

        <!-- IMPORTANTE: el estado está fuera del contenedor de resultados -->
        <div class="status-text" id="status" aria-live="polite">
            Cargando...
        </div>

        <div id="results"></div>

    </main>

    <aside class="knowledge-column" id="knowledge-panel"></aside>

</div>

<footer>
    <p>Chronioñ Search · Motor de búsqueda open-source</p>
    <p style="margin-top:7px;">
        <a href="index.html">Inicio</a> ·
        <a href="Privacy.html">Privacidad</a> ·
        <a href="Conditions.html">Condiciones</a>
    </p>
    <p style="margin-top:7px;">Hecho para una web más libre. 🚀</p>
</footer>

<!-- MINIJUEGO AMOGUS -->

<div id="amogus-game-overlay" role="dialog" aria-modal="true" aria-label="Minijuego AMOGUS">

    <div class="game-header" id="game-title">
        ¡ESQUIVA LOS ASTEROIDES!
    </div>

    <canvas id="amogus-canvas" width="600" height="400"></canvas>

    <div class="game-controls">
        <button class="game-btn" id="game-left">◀ Izquierda</button>
        <button class="game-btn" id="game-right">Derecha ▶</button>
    </div>

    <div class="game-controls">
        <button class="game-btn" id="game-restart">Reiniciar</button>
        <button class="game-btn" id="game-close">Salir</button>
    </div>

    <p class="game-help">
        Usa las flechas o A/D para moverte. Recoge estrellas y esquiva los asteroides.
    </p>

</div>

<script>
'use strict';

/* =========================================
   CONFIGURACIÓN
========================================= */

const params = new URLSearchParams(location.search);

const query = params.get('q') || '';
const initialMode = params.get('mode') || 'todo';

const validModes = ['todo', 'ia', 'img', 'videos', 'noticias'];

let currentMode = validModes.includes(initialMode)
    ? initialMode
    : 'todo';

const input = document.getElementById('searchInput');
const modeInput = document.getElementById('modeInput');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const kgPanel = document.getElementById('knowledge-panel');

let searchRequestId = 0;

/* =========================================
   UTILIDADES
========================================= */

function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[char]);
}

function safeURL(value) {
    try {
        const url = new URL(value);

        if (!['https:', 'http:'].includes(url.protocol)) {
            return null;
        }

        return url.href;
    } catch {
        return null;
    }
}

function normalizeText(value) {
    return String(value ?? '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
}

function setStatus(message) {
    statusEl.textContent = message;
}

function clearKnowledgePanel() {
    kgPanel.style.display = 'none';
    kgPanel.innerHTML = '';
}

/* =========================================
   INICIALIZACIÓN
========================================= */

input.value = query;
modeInput.value = currentMode;

document.title = query
    ? `${query} - Chronioñ Search`
    : 'Búsqueda en Chronioñ';

document.querySelectorAll('.tab[data-mode]').forEach(tab => {
    tab.classList.toggle(
        'active',
        tab.dataset.mode === currentMode
    );

    tab.addEventListener('click', () => {
        switchTab(tab.dataset.mode);
    });
});

// Maps es una página independiente: pasa la búsqueda actual sin
// convertirla en un modo del motor de resultados.
const mapsTab = document.getElementById('tab-maps');
mapsTab.addEventListener('click', event => {
    const mapsQuery = input.value.trim();
    if (mapsQuery) {
        mapsTab.href = 'map.html?q=' + encodeURIComponent(mapsQuery);
    } else {
        mapsTab.href = 'map.html';
    }
});

if (query.trim()) {
    executeSearch(query);
} else {
    setStatus('Escribe algo en la barra para buscar.');
}

/* =========================================
   CAMBIAR DE PESTAÑA
========================================= */

function switchTab(mode) {
    if (!validModes.includes(mode)) return;

    currentMode = mode;
    modeInput.value = mode;

    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.toggle(
            'active',
            tab.dataset.mode === mode
        );
    });

    const url = new URL(location.href);

    url.searchParams.set('mode', mode);

    if (query) {
        url.searchParams.set('q', query);
    }

    history.replaceState({}, '', url);

    if (query.trim()) {
        executeSearch(query);
    } else {
        setStatus('Escribe algo para buscar.');
        resultsEl.innerHTML = '';
        clearKnowledgePanel();
    }
}

/* =========================================
   BÚSQUEDA EN LA BASE DE DATOS
========================================= */

async function buscarEnDB(q) {
    try {
        const response = await fetch('urls-db.json', {
            cache: 'no-store'
        });

        if (!response.ok) {
            throw new Error('No se pudo cargar urls-db.json');
        }

        const db = await response.json();

        if (!Array.isArray(db)) return [];

        const normalizedQuery = normalizeText(q);
        const terms = normalizedQuery.split(/\s+/).filter(Boolean);

        return db.map(item => {
            if (!item || !item.url || !item.title) {
                return null;
            }

            const title = String(item.title);
            const description = String(item.description || '');
            const url = String(item.url);
            const category = String(item.category || '');

            const normalizedTitle = normalizeText(title);
            const normalizedURL = normalizeText(url);
            const normalizedDescription = normalizeText(description);
            const normalizedCategory = normalizeText(category);

            let score = 0;

            for (const term of terms) {
                if (normalizedTitle.includes(term)) score += 8;
                if (normalizedURL.includes(term)) score += 5;
                if (normalizedDescription.includes(term)) score += 2;
                if (normalizedCategory.includes(term)) score += 1;
            }

            if (normalizedTitle === normalizedQuery) score += 30;
            if (normalizedURL === normalizedQuery) score += 20;

            if (normalizedTitle.startsWith(normalizedQuery)) {
                score += 8;
            }

            return score > 0
                ? { ...item, score }
                : null;
        })
        .filter(Boolean)
        .sort((a, b) => b.score - a.score)
        .slice(0, 20);

    } catch (error) {
        console.warn('Chronioñ DB:', error);
        return [];
    }
}

/* =========================================
   BÚSQUEDA EN WIKIPEDIA
========================================= */

async function buscarEnWikipedia(q) {
    const wikiURL =
        'https://es.wikipedia.org/w/api.php?' +
        'action=query' +
        '&generator=search' +
        '&gsrnamespace=0' +
        '&gsrsearch=' + encodeURIComponent(q) +
        '&gsrlimit=10' +
        '&prop=extracts|pageimages' +
        '&exintro=1' +
        '&explaintext=1' +
        '&pithumbsize=250' +
        '&format=json' +
        '&origin=*';

    const response = await fetch(wikiURL);

    if (!response.ok) {
        throw new Error('Wikipedia no disponible');
    }

    const data = await response.json();

    if (!data.query?.pages) {
        return [];
    }

    return Object.values(data.query.pages);
}

/* =========================================
   RESULTADOS DE SITIOS REGISTRADOS
========================================= */

function renderDBResults(items) {
    const validItems = items.filter(item => safeURL(item.url));

    if (!validItems.length) return '';

    let html = `
        <section>
            <h2 class="section-title">
                🌐 Sitios registrados en Chronioñ
            </h2>
    `;

    for (const item of validItems) {
        const url = safeURL(item.url);
        const hostname = new URL(url).hostname;

        html += `
            <article class="result-item">

                <div class="result-site">
                    🌐 ${escapeHTML(hostname)}
                </div>

                <a
                    href="${escapeHTML(url)}"
                    class="result-title"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ${escapeHTML(item.title)}
                </a>

                <p class="result-snippet">
                    ${escapeHTML(item.description || 'Sin descripción disponible.')}
                </p>

                <div class="result-meta">
                    ${escapeHTML(item.category || 'General')}
                    · Registrado por ${escapeHTML(item.owner || 'Comunidad')}
                </div>

            </article>
        `;
    }

    html += '</section>';

    return html;
}

/* =========================================
   RESULTADOS DE WIKIPEDIA
========================================= */

function renderWikiResults(pages) {
    if (!pages.length) {
        return `
            <p class="status-text">
                No se encontraron artículos en Wikipedia.
            </p>
        `;
    }

    let html = `
        <section>
            <h2 class="section-title">
                📚 Resultados de Wikipedia
            </h2>
    `;

    for (const page of pages) {
        const title = String(page.title || 'Artículo');
        const wikiLink =
            'https://es.wikipedia.org/wiki/' +
            encodeURIComponent(title.replace(/ /g, '_'));

        const extract = String(page.extract || 'Sin descripción disponible.');

        const image = page.thumbnail?.source
            ? safeURL(page.thumbnail.source)
            : null;

        html += `
            <article class="result-item">

                <div class="result-site">
                    🌐 es.wikipedia.org/wiki/${escapeHTML(encodeURIComponent(title))}
                </div>

                <a
                    href="${escapeHTML(wikiLink)}"
                    class="result-title"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ${escapeHTML(title)}
                </a>

                <div class="result-snippet">

                    ${image ? `
                        <img

function detectEasterEgg(q) {
    const normalized = normalizeText(q);
    const words = normalized.split(/\s+/);

    const amongUsWords = [
        'amogus',
        'sus',
        'impostor',
        'amongus',
        'vent'
    ];

    if (
        amongUsWords.some(word => words.includes(word)) ||
        normalized.includes('among us')
    ) {
        return 'amogus';
    }

    if (normalized === 'matrix' || normalized === 'the matrix') {
        return 'matrix';
    }

    if (normalized === '42') {
        return '42';
    }

    if (
        normalized === 'nexus' ||
        normalized === 'nexus ai' ||
        normalized === 'nexus.ai'
    ) {
        return 'nexus';
    }

    if (
        normalized === 'chronion' ||
        normalized === 'chronion search'
    ) {
        return 'chronion';
    }

    if (
        normalized === 'hola' ||
        normalized === 'hello' ||
        normalized === 'buenas'
    ) {
        return 'hello';
    }

    if (
        normalized === 'do a barrel roll' ||
        normalized === 'barrel roll'
    ) {
        return 'barrel';
    }

    return null;
}

    // Los easter eggs solo se activan en Todo.

/* =========================================
   MINIJUEGO AMOGUS
   Esquiva obstáculos y recoge estrellas.
========================================= */

const gameOverlay = document.getElementById('amogus-game-overlay');
const canvas = document.getElementById('amogus-canvas');
const ctx = canvas.getContext('2d');

let gameLoop = null;
let enemyTimer = null;
let gameRunning = false;
let gameOver = false;
let gameScore = 0;
let gameFrame = 0;

let player = {
    x: 285,
    y: 340,
    width: 30,
    height: 40,
    speed: 6
};

let asteroids = [];
let stars = [];
let gameKeys = new Set();

function startAmogusGame() {
    closeGame();

    gameOverlay.style.display = 'flex';

    gameRunning = true;
    gameOver = false;
    gameScore = 0;
    gameFrame = 0;

    player.x = 285;

    asteroids = [];
    stars = [];

    gameKeys.clear();

    document.getElementById('game-title').textContent =
        '🚀 PUNTOS: 0';

    enemyTimer = setInterval(() => {
        if (!gameRunning || gameOver) return;

        asteroids.push({
            x: Math.random() * (canvas.width - 30),
            y: -35,
            size: 22 + Math.random() * 12,
            speed: 2 + Math.random() * 2
        });

        if (Math.random() > .45) {
            stars.push({
                x: Math.random() * (canvas.width - 15),
                y: -20,
                size: 12,
                speed: 2.5
            });
        }

    }, 750);

    gameLoop = requestAnimationFrame(updateGame);
}

function closeGame() {
    gameRunning = false;

    if (gameLoop) {
        cancelAnimationFrame(gameLoop);
    }

    if (enemyTimer) {
        clearInterval(enemyTimer);
    }

    gameLoop = null;
    enemyTimer = null;

    gameKeys.clear();

    gameOverlay.style.display = 'none';
}

function endGame() {
    gameOver = true;

    if (enemyTimer) {
        clearInterval(enemyTimer);
    }

    enemyTimer = null;

    document.getElementById('game-title').textContent =
        `💥 GAME OVER · PUNTOS: ${gameScore}`;
}

function updateGame() {
    if (!gameRunning || gameOver) return;

    gameFrame++;

    ctx.fillStyle = '#101010';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Estrellas del fondo.
    ctx.fillStyle = '#555';

    for (let i = 0; i < 35; i++) {
        const x = (i * 97) % canvas.width;
        const y = (i * 71 + gameFrame * .5) % canvas.height;

        ctx.fillRect(x, y, 2, 2);
    }

    // Movimiento.
    if (gameKeys.has('ArrowLeft') || gameKeys.has('a')) {
        player.x -= player.speed;
    }

    if (gameKeys.has('ArrowRight') || gameKeys.has('d')) {
        player.x += player.speed;
    }

    player.x = Math.max(
        0,
        Math.min(canvas.width - player.width, player.x)
    );

    // Jugador.
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Visor.
    ctx.fillStyle = '#8deaff';
    ctx.fillRect(player.x + 7, player.y + 8, 19, 12);

    // Asteroides.
    asteroids = asteroids.filter(asteroid => {
        asteroid.y += asteroid.speed;

        ctx.fillStyle = '#a0a0a0';
        ctx.beginPath();
        ctx.arc(
            asteroid.x + asteroid.size / 2,
            asteroid.y + asteroid.size / 2,
            asteroid.size / 2,
            0,
            Math.PI * 2
        );
        ctx.fill();

        const collision =
            asteroid.x < player.x + player.width &&
            asteroid.x + asteroid.size > player.x &&
            asteroid.y < player.y + player.height &&
            asteroid.y + asteroid.size > player.y;

        if (collision) {
            endGame();
            return false;
        }

        return asteroid.y < canvas.height;
    });

    if (gameOver) return;

    // Estrellas para recoger.
    stars = stars.filter(star => {
        star.y += star.speed;

        ctx.fillStyle = '#ffe66d';
        ctx.font = '20px Arial';
        ctx.fillText('★', star.x, star.y);

        const collected =
            star.x < player.x + player.width &&
            star.x + star.size > player.x &&
            star.y < player.y + player.height &&
            star.y + star.size > player.y;

        if (collected) {
            gameScore += 5;

            document.getElementById('game-title').textContent =
                `🚀 PUNTOS: ${gameScore}`;

            return false;
        }

        return star.y < canvas.height;
    });

    // Puntos por sobrevivir.
    if (gameFrame % 60 === 0) {
        gameScore++;

        document.getElementById('game-title').textContent =
            `🚀 PUNTOS: ${gameScore}`;
    }

    gameLoop = requestAnimationFrame(updateGame);
}

/* =========================================
   CONTROLES DEL JUEGO
========================================= */

document.addEventListener('keydown', event => {
    if (!gameRunning || gameOver) return;

    const key = event.key.toLowerCase();

    if (['arrowleft', 'arrowright', ' '].includes(key)) {
        event.preventDefault();
    }

    gameKeys.add(key);
});

document.addEventListener('keyup', event => {
    gameKeys.delete(event.key.toLowerCase());
});

document.getElementById('game-left').addEventListener('click', () => {
    if (gameRunning && !gameOver) {
        player.x = Math.max(0, player.x - 35);
    }
});

document.getElementById('game-right').addEventListener('click', () => {
    if (gameRunning && !gameOver) {
        player.x = Math.min(
            canvas.width - player.width,
            player.x + 35
        );
    }
});

document.getElementById('game-restart')
    .addEventListener('click', startAmogusGame);

document.getElementById('game-close')
    .addEventListener('click', closeGame);

document.addEventListener('visibilitychange', () => {
    if (document.hidden && gameRunning) {
        closeGame();
    }
});

/* =========================================

========================================= */

// "/" enfoca el buscador.
// Escape cierra el minijuego.

document.addEventListener('keydown', event => {
    if (
        event.key === '/' &&
        document.activeElement !== input
    ) {
        event.preventDefault();
        input.focus();
    }

    if (event.key === 'Escape' && gameRunning) {
        closeGame();
    }
});

/* =========================================
   KONAMI CODE
   ↑ ↑ ↓ ↓ ← → ← → B A
========================================= */

const konamiCode = [
    'ArrowUp',
    'ArrowUp',
    'ArrowDown',
    'ArrowDown',
    'ArrowLeft',
    'ArrowRight',
    'ArrowLeft',
    'ArrowRight',
    'b',
    'a'
];

let konamiPosition = 0;

document.addEventListener('keydown', event => {
    if (gameRunning) return;

    const expected = konamiCode[konamiPosition];

    if (event.key === expected) {
        konamiPosition++;

        if (konamiPosition === konamiCode.length) {
            konamiPosition = 0;

            resultsEl.innerHTML = `
                <div class="special-card chronion-card">
                    <div class="special-icon">🎮</div>
                    <h2>¡KONAMI CODE ACTIVADO!</h2>
                    <p>Has encontrado un secreto clásico de los videojuegos.</p>
                </div>
            `;

            setStatus('🎮 Código secreto descubierto');
            clearKnowledgePanel();
        }

    } else {
        konamiPosition = event.key === konamiCode[0] ? 1 : 0;
    }
});
