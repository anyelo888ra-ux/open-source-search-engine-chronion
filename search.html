<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda en Chronioñ</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #202124; color: #bdc1c6; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header Estilo Google */
        header { display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid #3c4043; gap: 24px; }
        .logo-link { height: 30px; display: flex; align-items: center; text-decoration: none; }
        .logo-link img { height: 100%; width: auto; }
        
        .search-box { flex: 1; max-width: 690px; }
        .search-box form { display: flex; }
        input[type="text"] {
            width: 100%;
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 24px;
            border: 1px solid #5f6368;
            background-color: #303134;
            color: #e8eaed;
            outline: none;
        }
        input[type="text"]:focus { border-color: #8ab4f8; }

        /* Navegación por pestañas */
        .nav-tabs { display: flex; gap: 20px; padding: 12px 160px; border-bottom: 1px solid #3c4043; font-size: 14px; }
        .tab { color: #9aa0a6; text-decoration: none; padding-bottom: 8px; border-bottom: 3px solid transparent; }
        .tab.active { color: #8ab4f8; border-color: #8ab4f8; font-weight: 500; }

        /* Contenedor de Resultados */
        .results-container { max-width: 650px; margin-left: 160px; padding: 20px 0; flex: 1; }
        .status-text { font-size: 14px; color: #9aa0a6; margin-bottom: 20px; }

        .result-item { margin-bottom: 28px; }
        .result-site { font-size: 12px; color: #bdc1c6; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .result-title { font-size: 20px; color: #8ab4f8; text-decoration: none; display: inline-block; margin-bottom: 6px; }
        .result-title:hover { text-decoration: underline; }
        .result-snippet { font-size: 14px; color: #bdc1c6; line-height: 1.5; }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; }
            .nav-tabs, .results-container { margin-left: 20px; padding-left: 0; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link">
            <img src="logo.svg" alt="Chronioñ Logo">
        </a>
        <div class="search-box">
            <form action="search.html" method="GET">
                <input type="text" id="searchInput" name="q" required autocomplete="off">
            </form>
        </div>
    </header>

    <div class="nav-tabs">
        <a href="#" class="tab active">Todo</a>
        <a href="#" class="tab">Imágenes</a>
        <a href="#" class="tab">Vídeos</a>
        <a href="#" class="tab">Noticias</a>
    </div>

    <main class="results-container" id="results">
        <div class="status-text" id="status">Cargando resultados de la web...</div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const container = document.getElementById('results');
        const statusEl = document.getElementById('status');

        if (query) {
            document.getElementById('searchInput').value = query;
            document.title = `${query} - Búsqueda en Chronioñ`;
            fetchResults(query);
        } else {
            statusEl.innerText = 'Escribe algo en la barra para buscar.';
        }

        // Función para consultar resultados automáticamente
        async function fetchResults(searchQuery) {
            try {
                // API pública de búsqueda en español
                const response = await fetch(`https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(searchQuery)}&format=json&origin=*`);
                const data = await response.json();
                
                const searchResults = data.query.search;
                
                if (searchResults.length === 0) {
                    statusEl.innerText = `No se encontraron resultados para "${searchQuery}".`;
                    return;
                }

                statusEl.innerText = `Cerca de ${searchResults.length * 120} resultados encontrados para "${searchQuery}"`;

                let htmlContent = `<div class="status-text">${statusEl.innerText}</div>`;

                searchResults.forEach(item => {
                    const title = item.title;
                    const snippet = item.snippet.replace(/<span class="searchmatch">/g, '<b>').replace(/<\/span>/g, '</b>');
                    const pageUrl = `https://es.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g, '_'))}`;

                    htmlContent += `
                        <div class="result-item">
                            <div class="result-site">🌐 ${pageUrl}</div>
                            <a href="${pageUrl}" class="result-title" target="_blank">${title}</a>
                            <div class="result-snippet">${snippet}...</div>
                        </div>
                    `;
                });

                container.innerHTML = htmlContent;

            } catch (error) {
                console.error("Error al obtener búsquedas:", error);
                statusEl.innerText = 'Ocurrió un error al cargar los resultados de la red.';
            }
        }
    </script>
</body>
</html>
