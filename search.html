<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda en Chronioñ</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="ban-bot-18.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #202124; color: #bdc1c6; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        /* Header */
        header { display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid #3c4043; gap: 24px; }
        .logo-link { height: 30px; display: flex; align-items: center; text-decoration: none; }
        .logo-link img { height: 100%; width: auto; }
        .search-box { flex: 1; max-width: 690px; }
        .search-box form { display: flex; }
        input[type="text"] {
            width: 100%; padding: 10px 18px; font-size: 15px; border-radius: 24px;
            border: 1px solid #5f6368; background-color: #303134; color: #e8eaed; outline: none;
        }
        input[type="text"]:focus { border-color: #8ab4f8; }

        /* Tabs */
        .nav-tabs { display: flex; gap: 20px; padding: 12px 160px; border-bottom: 1px solid #3c4043; font-size: 14px; }
        .tab { color: #9aa0a6; text-decoration: none; padding-bottom: 8px; border-bottom: 3px solid transparent; cursor: pointer; }
        .tab.active { color: #8ab4f8; border-color: #8ab4f8; font-weight: 500; }
        .tab.ai-tab { color: #c2e7ff; background: linear-gradient(90deg, #a8c7fa, #d3e3fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }

        /* Layout */
        .main-layout { display: flex; max-width: 1100px; margin-left: 160px; padding: 20px 0; flex: 1; gap: 40px; }
        .results-column { flex: 1; max-width: 680px; }
        .knowledge-column { width: 350px; display: none; }
        
        .status-text { font-size: 14px; color: #9aa0a6; margin-bottom: 20px; }

        /* Tarjeta Modo IA */
        .ai-overview-card {
            background: #1e1f20; border: 1px solid #3c4043; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 24px; border-left: 4px solid #8ab4f8;
        }
        .ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; color: #8ab4f8; font-size: 15px; }
        .ai-content { font-size: 15px; color: #e8eaed; line-height: 1.6; }

        /* Resultados */
        .result-item { margin-bottom: 28px; }
        .result-site { font-size: 12px; color: #bdc1c6; margin-bottom: 4px; word-break: break-all; }
        .result-title { font-size: 20px; color: #8ab4f8; text-decoration: none; display: inline-block; margin-bottom: 6px; }
        .result-title:hover { text-decoration: underline; }
        .result-snippet { font-size: 14px; color: #bdc1c6; line-height: 1.5; }
        .result-img { max-width: 100px; border-radius: 8px; float: left; margin-right: 15px; margin-bottom: 5px; }

        /* PANEL DE CONOCIMIENTO */
        .knowledge-panel { background: #1e1f20; border: 1px solid #3c4043; border-radius: 12px; overflow: hidden; }
        .kg-header { padding: 20px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #3c4043; }
        .kg-title { font-size: 24px; font-weight: 500; color: #fff; }
        .kg-desc { font-size: 14px; line-height: 1.5; color: #e8eaed; }
        .kg-details { padding: 15px 20px; }
        .kg-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #303134; font-size: 14px; }
        .kg-related { padding: 20px; border-top: 1px solid #3c4043; }
        .kg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .kg-card { background: #303134; border-radius: 8px; padding: 10px; text-align: center; text-decoration: none; color: #e8eaed; }
        .kg-card img { width: 60px; height: 60px; border-radius: 8px; object-fit: contain; margin-bottom: 8px; }

        /* AMONG US EASTER EGG */
        .amogus-card {
            background: linear-gradient(135deg, #C51111, #7A0000);
            border: 2px solid #FF0000;
            border-radius: 12px; padding: 30px; text-align: center; color: white;
            box-shadow: 0 0 30px rgba(255,0,0,0.4); margin-bottom: 20px;
        }
        .amogus-title { font-size: 32px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .amogus-btn {
            background: #FF0000; color: white; border: 2px solid white; padding: 12px 24px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            margin-top: 20px; transition: 0.2s; box-shadow: 0 4px 0 #500000;
        }
        .amogus-btn:hover { background: #FF3333; transform: translateY(-2px); box-shadow: 0 6px 0 #500000; }
        .amogus-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #500000; }

        /* GAME OVERLAY */
        #amogus-game-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); z-index: 9999; display: none; flex-direction: column;
            justify-content: center; align-items: center;
        }
        #amogus-canvas { background: #111; border: 2px solid #FF0000; border-radius: 12px; }
        .game-header { color: #FF0000; font-size: 24px; font-weight: bold; margin-bottom: 15px; font-family: monospace; }
        .game-btn { margin-top: 15px; background: #FF0000; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column; margin-left: 20px; }
            .nav-tabs { padding: 12px 20px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link"><img src="logo.svg" alt="Chronioñ Logo"></a>
        <div class="search-box">
            <form action="search.html" method="GET">
                <input type="text" id="searchInput" name="q" required autocomplete="off">
            </form>
        </div>
    </header>

    <div class="nav-tabs">
        <a class="tab active" id="tab-todo" onclick="switchTab('todo')">Todo</a>
        <a class="tab ai-tab" id="tab-ia" onclick="switchTab('ia')">✨ Modo IA</a>
        <a class="tab" id="tab-img" onclick="switchTab('img')">Imágenes</a>
        <a class="tab" id="tab-videos" onclick="switchTab('videos')">Vídeos</a>
        <a class="tab" id="tab-noticias" onclick="switchTab('noticias')">Noticias</a>
    </div>

    <div class="main-layout">
        <main class="results-column" id="results">
            <div class="status-text" id="status">Cargando...</div>
        </main>
        <aside class="knowledge-column" id="knowledge-panel"></aside>
    </div>

    <div id="amogus-game-overlay">
        <div class="game-header" id="game-title">¡ERES EL IMPOSTOR!</div>
        <canvas id="amogus-canvas" width="600" height="400"></canvas>
        <button class="game-btn" onclick="closeGame()">Salir del juego</button>
    </div>

    <script>

const urlParams = new URLSearchParams(window.location.search);
const query = urlParams.get('q') || '';

const container = document.getElementById('results');
const statusEl = document.getElementById('status');
const kgPanel = document.getElementById('knowledge-panel');

let currentMode = 'todo';
let gameLoop = null;
let enemyTimer = null;
let keyHandler = null;

const memeTriggers = [
    'amogus', 'sus', 'impostor', 'among us', 'amongus', 'vent'
];

// Escapar texto procedente de Wikipedia o de la base de URLs.
function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[char]);
}

// Solo permitir enlaces HTTP y HTTPS.
function safeURL(value) {
    try {
        const url = new URL(value);
        return ['https:', 'http:'].includes(url.protocol)
            ? url.href
            : null;
    } catch {
        return null;
    }
}

if (query) {
    document.getElementById('searchInput').value = query;
    document.title = `${query} - Búsqueda en Chronioñ`;
    executeSearch(query);
} else {
    statusEl.innerText = 'Escribe algo en la barra para buscar.';
}

function switchTab(mode) {
    currentMode = mode;

    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
    });

    document.getElementById(`tab-${mode}`).classList.add('active');

    if (query) executeSearch(query);
}

// ==========================================
// BUSCAR EN LA BASE DE DATOS DE CHRONIOÑ
// ==========================================

async function buscarEnDB(q) {
    try {
        const response = await fetch('urls-db.json', {
            cache: 'no-cache'
        });

        if (!response.ok) throw new Error('No se pudo cargar urls-db.json');

        const db = await response.json();
        if (!Array.isArray(db)) return [];

        const terms = q.toLowerCase().trim().split(/\s+/);

        return db.map(item => {
            if (!item || !item.url || !item.title) return null;

            const title = String(item.title);
            const description = String(item.description || '');
            const url = String(item.url);

            const searchable = `${title} ${description} ${url}`.toLowerCase();

            let score = 0;

            // Coincidencias por palabras.
            for (const term of terms) {
                if (title.toLowerCase().includes(term)) score += 5;
                if (url.toLowerCase().includes(term)) score += 4;
                if (description.toLowerCase().includes(term)) score += 1;
            }

            // Priorizar coincidencias exactas.
            if (title.toLowerCase() === q.toLowerCase()) score += 15;
            if (url.toLowerCase() === q.toLowerCase()) score += 15;

            return score > 0
                ? { ...item, score }
                : null;
        })
        .filter(Boolean)
        .sort((a, b) => b.score - a.score);

    } catch (error) {
        console.warn('Error en Chronioñ DB:', error);
        return [];
    }
}

// ==========================================
// BUSCAR EN WIKIPEDIA
// ==========================================

async function buscarEnWikipedia(q) {
    const wikiUrl =
        `https://es.wikipedia.org/w/api.php?action=query` +
        `&generator=search&gsrsearch=${encodeURIComponent(q)}` +
        `&gsrlimit=10&prop=extracts|pageimages` +
        `&exintro&explaintext&pithumbsize=200` +
        `&format=json&origin=*`;

    const response = await fetch(wikiUrl);

    if (!response.ok) throw new Error('Wikipedia no disponible');

    const data = await response.json();

    if (!data.query || !data.query.pages) return [];

    return Object.values(data.query.pages);
}

// ==========================================
// GENERAR RESULTADOS DE WEBS REGISTRADAS
// ==========================================

function renderDBResults(results) {
    if (!results.length) return '';

    let html = `
        <section>
            <h2 style="font-size:17px;margin-bottom:18px;color:#8ab4f8;">
                🌐 Sitios registrados en Chronioñ
            </h2>
    `;

    results.forEach(item => {
        const url = safeURL(item.url);
        if (!url) return;

        html += `
            <div class="result-item">
                <div class="result-site">
                    🌐 ${escapeHTML(new URL(url).hostname)}
                </div>

                <a href="${escapeHTML(url)}"
                   class="result-title"
                   target="_blank"
                   rel="noopener noreferrer">
                    ${escapeHTML(item.title)}
                </a>

                <div class="result-snippet">
                    ${escapeHTML(item.description || 'Sin descripción disponible.')}
                </div>

                <div style="font-size:12px;color:#9aa0a6;margin-top:5px;">
                    ${escapeHTML(item.category || 'General')}
                    · Registrado por ${escapeHTML(item.owner || 'Comunidad')}
                </div>
            </div>
        `;
    });

    html += '</section>';
    return html;
}

// ==========================================
// GENERAR RESULTADOS DE WIKIPEDIA
// ==========================================

function renderWikiResults(pages) {
    if (!pages.length) {
        return '<p class="status-text">No se encontraron artículos en Wikipedia.</p>';
    }

    let html = `
        <section style="margin-top:25px;">
            <h2 style="font-size:17px;margin-bottom:18px;color:#8ab4f8;">
                📚 Resultados de Wikipedia
            </h2>
    `;

    pages.forEach(page => {
        const title = escapeHTML(page.title);
        const wikiLink = `https://es.wikipedia.org/wiki/${encodeURIComponent(page.title)}`;

        const extract = page.extract
            ? page.extract.substring(0, 250) + (page.extract.length > 250 ? '...' : '')
            : 'Sin descripción disponible.';

        const image = page.thumbnail?.source
            ? `<img src="${escapeHTML(safeURL(page.thumbnail.source) || '')}"
                    class="result-img" alt="">`
            : '';

        html += `
            <div class="result-item">
                <div class="result-site">
                    🌐 es.wikipedia.org/wiki/${encodeURIComponent(page.title)}
                </div>

                <a href="${wikiLink}"
                   class="result-title"
                   target="_blank"
                   rel="noopener noreferrer">
                    ${title}
                </a>

                <div class="result-snippet">
                    ${image}${escapeHTML(extract)}
                </div>
            </div>
        `;
    });

    html += '</section>';
    return html;
}

// ==========================================
// MOTOR PRINCIPAL DE BÚSQUEDA
// ==========================================

async function executeSearch(q) {
    const lowerQ = q.toLowerCase().trim();

    container.innerHTML = '';
    statusEl.innerText = `Buscando "${q}"...`;
    kgPanel.style.display = 'none';

    if (!q.trim()) {
        statusEl.innerText = 'Escribe algo para buscar.';
        return;
    }

    // Easter egg.
    if (memeTriggers.some(trigger => lowerQ.includes(trigger))) {
        renderAmogusEasterEgg(q);
        return;
    }

    // Vídeos.
    if (currentMode === 'videos') {
        statusEl.innerText = `Vídeos para "${q}"`;

        container.innerHTML = `
            <div class="result-item">
                <div class="result-site">🌐 youtube.com</div>
                <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}"
                   target="_blank" rel="noopener noreferrer" class="result-title">
                    ▶️ Ver vídeos de "${escapeHTML(q)}" en YouTube
                </a>
            </div>
        `;
        return;
    }

    // Noticias.
    if (currentMode === 'noticias') {
        statusEl.innerText = `Noticias sobre "${q}"`;

        container.innerHTML = `
            <div class="result-item">
                <div class="result-site">🌐 news.google.com</div>
                <a href="https://news.google.com/search?q=${encodeURIComponent(q)}"
                   target="_blank" rel="noopener noreferrer" class="result-title">
                    📰 Noticias de "${escapeHTML(q)}"
                </a>
            </div>
        `;
        return;
    }

    statusEl.innerText = `Buscando en Chronioñ y Wikipedia: "${q}"`;

    try {
        // Consultar las dos fuentes al mismo tiempo.
        const [dbResults, wikiPages] = await Promise.all([
            buscarEnDB(q),
            buscarEnWikipedia(q).catch(error => {
                console.warn('Wikipedia:', error);
                return [];
            })
        ]);

        // Modo imágenes.
        if (currentMode === 'img') {
            let html = '';

            wikiPages.forEach(page => {
                if (!page.thumbnail?.source) return;

                const imageURL = safeURL(page.thumbnail.source);
                if (!imageURL) return;

                html += `
                    <a href="${escapeHTML(imageURL)}"
                       target="_blank" rel="noopener noreferrer"
                       style="background:#303134;padding:8px;border-radius:8px;text-align:center;text-decoration:none;color:white;">
                        <img src="${escapeHTML(imageURL)}"
                             style="width:100%;height:120px;object-fit:cover;border-radius:5px;"
                             alt="">
                        <p>${escapeHTML(page.title)}</p>
                    </a>
                `;
            });

            statusEl.innerText = `Imágenes para "${q}"`;

            container.innerHTML = html
                ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;">${html}</div>`
                : '<p class="status-text">No se encontraron imágenes.</p>';

            return;
        }

        // Modo IA.
        if (currentMode === 'ia') {
            let html = '';

            if (wikiPages.length) {
                const page = wikiPages[0];

                html += `
                    <div class="ai-overview-card">
                        <div class="ai-header">✨ Visión general de Chronioñ</div>
                        <div class="ai-content">
                            <strong>${escapeHTML(page.title)}:</strong>
                            ${escapeHTML(page.extract || 'Sin resumen disponible.')}
                        </div>
                    </div>
                `;
            }

            html += renderDBResults(dbResults);

            if (!wikiPages.length && !dbResults.length) {
                html = '<p class="status-text">No se encontraron resultados.</p>';
            }

            statusEl.innerText = `Resultados de Chronioñ IA para "${q}"`;
            container.innerHTML = html;
            return;
        }

        // Modo Todo: mostrar ambas fuentes.
        let html = '';

        if (dbResults.length) {
            html += renderDBResults(dbResults);
        }

        if (wikiPages.length) {
            html += renderWikiResults(wikiPages);

            if (wikiPages[0].thumbnail) {
                generateKnowledgeGraph(wikiPages[0]);
            }
        }

        if (!dbResults.length && !wikiPages.length) {
            html = `
                <div class="result-item">
                    <p class="status-text">
                        No encontramos resultados en Chronioñ ni Wikipedia.
                    </p>
                    <a href="https://duckduckgo.com/?q=${encodeURIComponent(q)}"
                       target="_blank" rel="noopener noreferrer"
                       class="result-title">
                        🔎 Buscar en DuckDuckGo
                    </a>
                </div>
            `;
        }

        container.innerHTML = html;

        statusEl.innerText =
            `${dbResults.length} sitios registrados · ${wikiPages.length} artículos de Wikipedia`;

    } catch (error) {
        console.error(error);

        statusEl.innerText = 'Error al realizar la búsqueda.';
        container.innerHTML = `
            <p class="status-text">
                No se pudo conectar con las fuentes de Chronioñ.
                Comprueba tu conexión e inténtalo de nuevo.
            </p>
        `;
    }
}

// ==========================================
// EASTER EGG AMONG US
// ==========================================

function renderAmogusEasterEgg(q) {
    statusEl.innerText = `Resultado sospechoso para "${q}"`;
    kgPanel.style.display = 'none';

    container.innerHTML = `
        <div class="amogus-card">
            <div class="amogus-title">¡AMOGUS DETECTADO!</div>
            <p style="font-size:18px;">
                Parece que has buscado algo muy <strong>sus</strong>.
            </p>
            <p style="font-size:14px;margin-top:10px;color:#ffcccc;">
                La IA de Chronioñ ha detectado actividad de impostores.
            </p>
            <button class="amogus-btn" onclick="startAmogusGame()">
                🚀 Lanzar Nave (Jugar)
            </button>
        </div>
    `;
}

// ==========================================
// MINIJUEGO
// ==========================================

let canvas, ctx, player, bullets, enemies, score, gameOver;

function startAmogusGame() {
    document.getElementById('amogus-game-overlay').style.display = 'flex';
    initAmogusGame();
}

function closeGame() {
    document.getElementById('amogus-game-overlay').style.display = 'none';

    if (gameLoop) cancelAnimationFrame(gameLoop);
    if (enemyTimer) clearInterval(enemyTimer);

    gameLoop = null;
    enemyTimer = null;

    if (keyHandler) {
        document.removeEventListener('keydown', keyHandler);
        keyHandler = null;
    }
}

function initAmogusGame() {
    closeGame();

    document.getElementById('amogus-game-overlay').style.display = 'flex';

    canvas = document.getElementById('amogus-canvas');
    ctx = canvas.getContext('2d');

    player = { x: 285, y: 350, w: 30, h: 40, speed: 7 };
    bullets = [];
    enemies = [];
    score = 0;
    gameOver = false;

    document.getElementById('game-title').innerText =
        '¡ERES EL IMPOSTOR! Puntos: 0';

    keyHandler = event => {
        if (gameOver) return;

        if (event.key === 'ArrowLeft') {
            player.x = Math.max(0, player.x - player.speed * 2);
        }

        if (event.key === 'ArrowRight') {
            player.x = Math.min(canvas.width - player.w, player.x + player.speed * 2);
        }

        if (event.code === 'Space') {
            event.preventDefault();
            bullets.push({
                x: player.x + player.w / 2,
                y: player.y,
                speed: 7
            });
        }
    };

    document.addEventListener('keydown', keyHandler);

    enemyTimer = setInterval(() => {
        if (!gameOver) {
            enemies.push({
                x: Math.random() * (canvas.width - 25),
                y: -30,
                w: 25,
                h: 25,
                speed: 2 + Math.random() * 2
            });
        }
    }, 800);

    gameLoop = requestAnimationFrame(updateGame);
}

function updateGame() {
    if (gameOver) return;

    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#FF0000';
    ctx.fillRect(player.x, player.y, player.w, player.h);

    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 5, player.y + 10, 15, 10);

    // Balas.
    ctx.fillStyle = '#00FF00';

    bullets = bullets.filter(b => {
        b.y -= b.speed;
        ctx.fillRect(b.x, b.y, 4, 10);
        return b.y > 0;
    });

    // Enemigos.
    ctx.fillStyle = '#00FFFF';

    enemies = enemies.filter(enemy => {
        enemy.y += enemy.speed;

        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);

        if (
            enemy.y + enemy.h > player.y &&
            enemy.x < player.x + player.w &&
            enemy.x + enemy.w > player.x
        ) {
            endGame('¡FUISTE EXPULSADO! GAME OVER');
            return false;
        }

        // Comprobar colisiones.
        const hitIndex = bullets.findIndex(b =>
            b.y < enemy.y + enemy.h &&
            b.y + 10 > enemy.y &&
            b.x > enemy.x &&
            b.x < enemy.x + enemy.w
        );

        if (hitIndex !== -1) {
            bullets.splice(hitIndex, 1);
            score++;

            document.getElementById('game-title').innerText =
                `¡ERES EL IMPOSTOR! Puntos: ${score}`;

            if (score >= 15) {
                endGame('¡VICTORIA! ¡MISIÓN COMPLETADA!');
            }

            return false;
        }

        return enemy.y < canvas.height;
    });

    if (!gameOver) {
        gameLoop = requestAnimationFrame(updateGame);
    }
}

function endGame(message) {
    gameOver = true;

    document.getElementById('game-title').innerText = message;

    if (enemyTimer) clearInterval(enemyTimer);
    enemyTimer = null;
}

// ==========================================
// PANEL DE CONOCIMIENTO
// ==========================================

function generateKnowledgeGraph(page) {
    const image = page.thumbnail?.source;
    const safeImage = image ? safeURL(image) : null;

    kgPanel.style.display = 'block';

    kgPanel.innerHTML = `
        <div class="knowledge-panel">
            <div class="kg-header">
                <div style="display:flex;align-items:center;gap:15px;">
                    ${safeImage ? `<img src="${escapeHTML(safeImage)}"
                        style="width:60px;height:60px;border-radius:8px;object-fit:cover;" alt="">` : ''}
                    <div>
                        <div class="kg-title">${escapeHTML(page.title)}</div>
                        <div style="font-size:13px;color:#bdc1c6;">
