<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda en Chronioñ</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #202124; color: #bdc1c6; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header Estilo Google Dark */
        header { display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid #3c4043; gap: 24px; }
        .logo-link { height: 30px; display: flex; align-items: center; text-decoration: none; }
        .logo-link img { height: 100%; width: auto; }
        
        .search-box { flex: 1; max-width: 690px; }
        .search-box form { display: flex; }
        input[type="text"] {
            width: 100%;
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 24px;
            border: 1px solid #5f6368;
            background-color: #303134;
            color: #e8eaed;
            outline: none;
        }
        input[type="text"]:focus { border-color: #8ab4f8; }

        /* Navegación por pestañas */
        .nav-tabs { display: flex; gap: 20px; padding: 12px 160px; border-bottom: 1px solid #3c4043; font-size: 14px; }
        .tab { color: #9aa0a6; text-decoration: none; padding-bottom: 8px; border-bottom: 3px solid transparent; }
        .tab.active { color: #8ab4f8; border-color: #8ab4f8; font-weight: 500; }

        /* Contenedor de Resultados */
        .results-container { max-width: 650px; margin-left: 160px; padding: 20px 0; flex: 1; }
        .status-text { font-size: 14px; color: #9aa0a6; margin-bottom: 20px; }

        .result-item { margin-bottom: 28px; }
        .result-site { font-size: 12px; color: #bdc1c6; margin-bottom: 4px; word-break: break-all; }
        .result-title { font-size: 20px; color: #8ab4f8; text-decoration: none; display: inline-block; margin-bottom: 6px; }
        .result-title:hover { text-decoration: underline; }
        .result-snippet { font-size: 14px; color: #bdc1c6; line-height: 1.5; }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; }
            .nav-tabs, .results-container { margin-left: 20px; padding-left: 0; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-link">
            <img src="logo.svg" alt="Chronioñ Logo">
        </a>
        <div class="search-box">
            <form action="search.html" method="GET">
                <input type="text" id="searchInput" name="q" required autocomplete="off">
            </form>
        </div>
    </header>

    <div class="nav-tabs">
        <a href="#" class="tab active">Todo</a>
        <a href="#" class="tab">Imágenes</a>
        <a href="#" class="tab">Vídeos</a>
        <a href="#" class="tab">Noticias</a>
    </div>

    <main class="results-container" id="results">
        <div class="status-text" id="status">Cargando resultados de la web...</div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const container = document.getElementById('results');
        const statusEl = document.getElementById('status');

        if (query) {
            document.getElementById('searchInput').value = query;
            document.title = `${query} - Búsqueda en Chronioñ`;
            fetchDuckDuckGo(query);
        } else {
            statusEl.innerText = 'Escribe algo en la barra para buscar.';
        }

        function fetchDuckDuckGo(searchQuery) {
            // Callback global para procesar la respuesta de la API de DuckDuckGo
            window.handleDDGResponse = function(data) {
                let htmlContent = '';
                let totalResults = 0;

                // 1. Respuesta directa (Instant Answer) si existe
                if (data.AbstractText && data.AbstractURL) {
                    totalResults++;
                    htmlContent += `
                        <div class="result-item" style="border-left: 3px solid #8ab4f8; padding-left: 12px;">
                            <div class="result-site">🌐 ${data.AbstractURL}</div>
                            <a href="${data.AbstractURL}" class="result-title" target="_blank">${data.Heading}</a>
                            <div class="result-snippet">${data.AbstractText}</div>
                        </div>
                    `;
                }

                // 2. Temas y resultados web variados
                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.forEach(topic => {
                        if (topic.FirstURL && topic.Text) {
                            totalResults++;
                            const titleParts = topic.Text.split(' - ');
                            const title = titleParts[0] || searchQuery;

                            htmlContent += `
                                <div class="result-item">
                                    <div class="result-site">🌐 ${topic.FirstURL}</div>
                                    <a href="${topic.FirstURL}" class="result-title" target="_blank">${title}</a>
                                    <div class="result-snippet">${topic.Text}</div>
                                </div>
                            `;
                        } else if (topic.Topics) {
                            // Subtemas agrupados
                            topic.Topics.forEach(subTopic => {
                                if (subTopic.FirstURL && subTopic.Text) {
                                    totalResults++;
                                    htmlContent += `
                                        <div class="result-item">
                                            <div class="result-site">🌐 ${subTopic.FirstURL}</div>
                                            <a href="${subTopic.FirstURL}" class="result-title" target="_blank">${subTopic.Text.split(' - ')[0]}</a>
                                            <div class="result-snippet">${subTopic.Text}</div>
                                        </div>
                                    `;
                                }
                            });
                        }
                    });
                }

                // Si no hay resultados directos, ofrece redirección web abierta
                if (totalResults === 0) {
                    statusEl.innerText = `Mostrando acceso directo para "${searchQuery}"`;
                    container.innerHTML = `
                        <div class="result-item">
                            <div class="result-site">🌐 https://duckduckgo.com/?q=${encodeURIComponent(searchQuery)}</div>
                            <a href="https://duckduckgo.com/?q=${encodeURIComponent(searchQuery)}" class="result-title" target="_blank">Buscar "${searchQuery}" en la Web Abierta</a>
                            <div class="result-snippet">Haz clic para consultar todas las coincidencias globales en la red.</div>
                        </div>
                    `;
                } else {
                    statusEl.innerText = `Cerca de ${totalResults * 15} resultados para "${searchQuery}"`;
                    container.innerHTML = `<div class="status-text">${statusEl.innerText}</div>` + htmlContent;
                }
            };

            // Inyección de script dinámico para bypass de CORS vía JSONP
            const script = document.createElement('script');
            script.src = `https://api.duckduckgo.com/?q=${encodeURIComponent(searchQuery)}&format=json&pretty=1&callback=handleDDGResponse`;
            script.onerror = function() {
                statusEl.innerText = 'Error al obtener respuesta del motor de búsqueda.';
            };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
